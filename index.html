
<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="sdardour.com is currently under maintenance.">

  <title>sdardour.com — Under maintenance</title>

  <style>

    :root {
      --ink: #0f1729;
      --muted: #5b6478;
      --card: rgba(255, 255, 255, 0.72);
      --border: rgba(15, 23, 41, 0.08);
      --accent: #6366f1;
      --accent-2: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background: linear-gradient(-45deg, #e0e7ff, #fce7f3, #dbeafe, #f3e8ff);
      background-size: 400% 400%;
      animation: drift 18s ease infinite;
      overflow: hidden;
    }

    @keyframes drift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Soft floating blobs in the background */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
    }
    .blob.one   { width: 320px; height: 320px; background: #a5b4fc; top: -80px; left: -60px;  animation: float 14s ease-in-out infinite; }
    .blob.two   { width: 280px; height: 280px; background: #f9a8d4; bottom: -70px; right: -50px; animation: float 17s ease-in-out infinite reverse; }
    .blob.three { width: 220px; height: 220px; background: #93c5fd; bottom: 10%; left: 8%;     animation: float 20s ease-in-out infinite; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(20px, -30px) scale(1.08); }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      text-align: center;
      padding: 2.75rem 2rem 2.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(15, 23, 41, 0.12);
      animation: rise 0.7s cubic-bezier(.2,.7,.2,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Pure-CSS spinning gear */
    .gear {
      width: 84px; height: 84px;
      margin: 0 auto 1.5rem;
      position: relative;
      color: var(--accent);
      animation: spin 9s linear infinite;
    }
    .gear svg { width: 100%; height: 100%; display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    h1 {
      font-size: 1.5rem;
      line-height: 1.3;
      letter-spacing: -0.01em;
      margin-bottom: 0.6rem;
    }

    .domain {
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 700;
    }

    p {
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 1.75rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #047857;
      background: rgba(16, 185, 129, 0.12);
      padding: 0.4rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 1.5rem;
    }
    .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
      animation: pulse 1.8s ease-out infinite;
    }
    @keyframes pulse {
      0%   { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.55); }
      70%  { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
      100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
    }

    a.cta {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      padding: 0.7rem 1.4rem;
      border-radius: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 22px rgba(99, 102, 241, 0.32);
    }
    a.cta:hover  { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(99, 102, 241, 0.42); }
    a.cta:active { transform: translateY(0); }
    a.cta svg { width: 18px; height: 18px; }

    footer {
      position: fixed;
      bottom: 1rem;
      left: 0; right: 0;
      z-index: 1;
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }

  </style>

</head>
